name: DIGITClusterworkflow

on:
  push:
    branches:
      - master
      - release-githubactions-hcm-demo-v1.7

  workflow_dispatch:
    inputs:
      destroyCommand:
        description: 'Type "destroy" to run the terraform_infra_destruction job.'
        required: true
        default: ''

jobs:
  Input_validation:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4 

      - name: Workflow started
        run: echo "GitHub Actions workflow has started"

      - name: Display input.yaml
        run: cat input.yaml
        working-directory: infra-as-code/terraform/sample-aws

      - name: Convert YAML to ENV
        uses: dcarbone/yaml-to-env-action@main
        with:
          yaml-file: infra-as-code/terraform/sample-aws/input.yaml
          mask-values: false

       - name: Display environment variables
         run: echo "Cluster Name: $CLUSTER_NAME"


      - name: Update files based on input.yaml
        run: go run init.go
        working-directory: infra-as-code/terraform/scripts

      - name: Archive infra-as-code
        run: tar -czf infra-as-code.tar.gz infra-as-code/

      - name: Archive config-as-code
        run: tar -czf config-as-code.tar.gz config-as-code/

      - name: Upload infra-as-code artifact
        uses: actions/upload-artifact@v4
        with:
          name: infra-as-code-artifact-input
          path: infra-as-code.tar.gz

      - name: Upload config-as-code artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-as-code-artifact-input
          path: config-as-code.tar.gz

  Terraform_Infra_Creation:
    if: ${{ github.event_name == 'push' }}
    needs: Input_validation
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Download infra artifact
        uses: actions/download-artifact@v4
        with:
          name: infra-as-code-artifact-input

      - name: Download config artifact
        uses: actions/download-artifact@v4
        with:
          name: config-as-code-artifact-input

      - name: Extract artifacts
        run: |
          tar -xzf infra-as-code.tar.gz
          tar -xzf config-as-code.tar.gz

      - name: Convert YAML to ENV
        uses: dcarbone/yaml-to-env-action@main
        with:
          yaml-file: infra-as-code/terraform/sample-aws/input.yaml
          mask-values: false

      - name: Install Terraform
        run: |
          curl -o terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
          terraform -version

      - name: Terraform init (remote-state)
        run: terraform init
        working-directory: infra-as-code/terraform/sample-aws/remote-state

      - name: Terraform apply (remote-state)
        run: terraform apply -auto-approve
        working-directory: infra-as-code/terraform/sample-aws/remote-state

      - name: Terraform init (infra)
        run: terraform init
        working-directory: infra-as-code/terraform/sample-aws

      - name: Terraform apply (infra)
        run: terraform apply -auto-approve -var db_password=${{ secrets.DB_PASSWORD }}
        working-directory: infra-as-code/terraform/sample-aws

      - name: Archive infra-as-code
        run: tar -czf infra-as-code.tar.gz infra-as-code/

      - name: Archive config-as-code
        run: tar -czf config-as-code.tar.gz config-as-code/

      - name: Upload infra artifact
        uses: actions/upload-artifact@v4
        with:
          name: infra-as-code-artifact-creation
          path: infra-as-code.tar.gz

      - name: Upload config artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-as-code-artifact-creation
          path: config-as-code.tar.gz

  DIGIT-deployment:
    if: ${{ github.event_name == 'push' }}
    needs: Terraform_Infra_Creation
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Download infra artifact
        uses: actions/download-artifact@v4
        with:
          name: infra-as-code-artifact-creation

      - name: Download config artifact
        uses: actions/download-artifact@v4
        with:
          name: config-as-code-artifact-creation

      - name: Extract artifacts
        run: |
          tar -xzf infra-as-code.tar.gz
          tar -xzf config-as-code.tar.gz

      - name: Convert YAML to ENV
        uses: dcarbone/yaml-to-env-action@main
        with:
          yaml-file: infra-as-code/terraform/sample-aws/input.yaml
          mask-values: false

      - name: DIGIT deployment
        run: go run digit_installer.go
        working-directory: deploy-as-code/deployer

  terraform_infra_destruction:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.destroyCommand == 'destroy' }}
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Convert YAML to ENV
        uses: dcarbone/yaml-to-env-action@main
        with:
          yaml-file: infra-as-code/terraform/sample-aws/input.yaml
          mask-values: false

      - name: Terraform destroy
        run: terraform destroy -auto-approve -var db_password=${{ secrets.DB_PASSWORD }}
        working-directory: infra-as-code/terraform/sample-aws
```
